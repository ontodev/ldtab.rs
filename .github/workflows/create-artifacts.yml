name: Create artifacts

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    strategy:
      matrix:
        target:
          # macOS builds (both arches)
          - { runner: "macos-latest",   arch: "x86_64-apple-darwin" }
          - { runner: "macos-latest",   arch: "aarch64-apple-darwin" }

          # Windows
          - { runner: "windows-2022",   arch: "x86_64-pc-windows-msvc" }

          # Linux (GNU + MUSL)
          - { runner: "ubuntu-latest",  arch: "x86_64-unknown-linux-gnu" }
          - { runner: "ubuntu-latest",  arch: "x86_64-unknown-linux-musl" }

    runs-on: ${{ matrix.target.runner }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.arch }}

      - name: Install musl-tools (MUSL)
        if: ${{ matrix.target.runner == 'ubuntu-latest' && matrix.target.arch == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build binary using cross (Linux)
        if: ${{ startsWith(matrix.target.runner, 'ubuntu') }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          sudo systemctl start docker || true
          cross build --release --target ${{ matrix.target.arch }}
          cp target/${{ matrix.target.arch }}/release/ldtab ldtab-${{ matrix.target.arch }}

      - name: Build binary using cargo (macOS)
        if: ${{ startsWith(matrix.target.runner, 'macos') }}
        run: |
          cargo build --release --target ${{ matrix.target.arch }}
          cp target/${{ matrix.target.arch }}/release/ldtab ldtab-${{ matrix.target.arch }}

      - name: Build binary using cargo (Windows)
        if: ${{ matrix.target.runner == 'windows-2022' }}
        run: |
          cargo build --release --target ${{ matrix.target.arch }}
          copy target\${{ matrix.target.arch }}\release\ldtab.exe ldtab-${{ matrix.target.arch }}.exe

      # Upload Unix-like binaries
      - name: Upload binary artifacts (Unix)
        if: ${{ matrix.target.runner != 'windows-2022' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target.arch }}-bin
          path: ldtab-${{ matrix.target.arch }}
          if-no-files-found: error

      # Upload Windows .exe
      - name: Upload binary artifacts (Windows)
        if: ${{ matrix.target.runner == 'windows-2022' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target.arch }}-bin
          path: ldtab-${{ matrix.target.arch }}.exe
          if-no-files-found: error
